---
- name: Deploy the isolated public static edge
  hosts: vps
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Prove the administrator and host boundary
      ansible.builtin.assert:
        that:
          - (ansible_user | default('')) == vps_admin_user
          - (ansible_user | default('')) not in ['root', vps_deploy_user]
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in vps_supported_ubuntu_releases
          - ansible_port | int == vps_ssh_port | int
          - vps_ssh_port | int == 22
          - vps_admin_authorized_keys | length > 0
          - vps_infra_revision is match('^[0-9a-f]{40}$')
          - vps_public_static_edge_state in ['prepare', 'activate', 'stopped']
        fail_msg: >-
          The public static edge requires the converged Atlas administrator
          boundary and one exact infrastructure revision.

    - name: Confirm the current connection is still responsive
      ansible.builtin.wait_for_connection:
        timeout: 20

  roles:
    - role: public_static_edge

  post_tasks:
    - name: Report the bounded public edge state
      ansible.builtin.debug:
        msg: >-
          Public static edge state is {{ vps_public_static_edge_state }}.
          PostgreSQL, Prometheus, Grafana, Surplasse, Parkventory, the locked
          release applicator, and DNS were not started or changed.
