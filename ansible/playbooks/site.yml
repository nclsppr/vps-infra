---
- name: Converge the production VPS host
  hosts: vps
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Prove that the administrator connection works before hardening
      ansible.builtin.assert:
        that:
          - inventory_hostname != 'production-vps' or (ansible_host | default('')) != 'vps.example.invalid'
          - (ansible_user | default('')) == vps_admin_user
          - (ansible_user | default('')) not in ['root', vps_deploy_user]
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in vps_supported_ubuntu_releases
          - vps_ssh_port | int == 22
          - ansible_port | int == vps_ssh_port | int
          - vps_admin_authorized_keys | length > 0
          - vps_deploy_authorized_keys is sequence
          - vps_deploy_authorized_keys is not string
          - vps_deploy_authorized_keys is not mapping
          - vps_deploy_authorized_keys | length > 0
          - vps_deploy_authorized_keys | length <= 4
          - (vps_parkventory_provider_ingress_authorized_key | default('')) is string
          - >-
            (vps_deploy_authorized_keys | length) +
            (1 if (vps_parkventory_provider_ingress_authorized_key |
             default('')) | length > 0 else 0) <= 4
          - >-
            vps_deploy_authorized_keys | unique | length ==
            vps_deploy_authorized_keys | length
        fail_msg: >-
          Refus du durcissement : site.yml doit déjà être connecté avec le
          compte administrateur et le port SSH définitif sur un Ubuntu validé,
          avec un ensemble borné et non vide de clés deploy.

    - name: Validate deployment public key syntax before any role
      ansible.builtin.assert:
        that:
          - >-
            item is match('^(ssh-ed25519|sk-ssh-ed25519@openssh.com|ecdsa-sha2-nistp256|sk-ecdsa-sha2-nistp256@openssh.com|ssh-rsa) [A-Za-z0-9+/=]+(?: .*)?$')
          - "'\n' not in item"
          - "'\r' not in item"
        fail_msg: >-
          Refus de la convergence : clé publique deploy invalide ou contenant
          déjà des options SSH.
      loop: "{{ vps_deploy_authorized_keys }}"
      loop_control:
        label: "clé deploy déclarée"

    - name: Validate the Parkventory provider ingress key before any role
      ansible.builtin.assert:
        that:
          - >-
            (vps_parkventory_provider_ingress_authorized_key | default(''))
            | length <= 16384
          - >-
            '\n' not in
            (vps_parkventory_provider_ingress_authorized_key | default(''))
          - >-
            '\r' not in
            (vps_parkventory_provider_ingress_authorized_key | default(''))
          - >-
            (vps_parkventory_provider_ingress_authorized_key | default('')) ==
            '' or (vps_parkventory_provider_ingress_authorized_key |
            default('')) is
            match('^(ssh-ed25519|sk-ssh-ed25519@openssh.com|ecdsa-sha2-nistp256|sk-ecdsa-sha2-nistp256@openssh.com|ssh-rsa) [A-Za-z0-9+/=]+(?: .*)?$')
        fail_msg: >-
          The temporary Parkventory provider ingress public key is invalid.
      no_log: true

    - name: Normalize desired deployment key identities before any role
      ansible.builtin.set_fact:
        site_deploy_key_identities: >-
          {{
            vps_deploy_authorized_keys | map('trim') |
            map('regex_replace', '^([^ ]+ [^ ]+)(?: .*)?$', '\1') | list
          }}
        site_parkventory_provider_ingress_key_identity: >-
          {{
            (vps_parkventory_provider_ingress_authorized_key | default('')) |
            trim | regex_replace('^([^ ]+ [^ ]+)(?: .*)?$', '\1')
          }}

    - name: Refuse duplicate deployment key identities before any role
      ansible.builtin.assert:
        that:
          - >-
            site_deploy_key_identities | unique | length ==
            site_deploy_key_identities | length
          - >-
            (vps_parkventory_provider_ingress_authorized_key | default('')) |
            length == 0 or site_parkventory_provider_ingress_key_identity not in
            site_deploy_key_identities
        fail_msg: >-
          Refus de converger deux déclarations de la même clé deploy avec des
          commentaires différents.

    - name: Cryptographically parse deployment public keys before any role
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -l
          - -E
          - sha256
          - -f
          - /dev/stdin
        stdin: "{{ item }}\n"
        stdin_add_newline: false
      check_mode: false
      changed_when: false
      loop: "{{ vps_deploy_authorized_keys }}"
      loop_control:
        label: "clé deploy déclarée"

    - name: Cryptographically parse the provider ingress key before any role
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -l
          - -E
          - sha256
          - -f
          - /dev/stdin
        stdin: >-
          {{ vps_parkventory_provider_ingress_authorized_key | default('') }}
        stdin_add_newline: true
      check_mode: false
      changed_when: false
      when: >-
        (vps_parkventory_provider_ingress_authorized_key | default('')) |
        length > 0
      no_log: true

    - name: Validate the one-use deployment key recovery nonce contract
      ansible.builtin.assert:
        that:
          - (vps_deploy_key_recovery_nonce | default('')) is string
          - >-
            (vps_deploy_key_recovery_nonce | default('')) == '' or
            (vps_deploy_key_recovery_nonce | default(''))
            is match('^[0-9a-f]{64}$')
          - >-
            (vps_deploy_key_recovery_nonce | default('')) == '' or
            vps_deploy_authorized_keys | length == 1
        fail_msg: >-
          Le nonce de récupération deploy doit rester vide en fonctionnement
          normal ou contenir exactement 64 caractères hexadécimaux minuscules.
      no_log: true

    - name: Confirm the current connection is still responsive
      ansible.builtin.wait_for_connection:
        timeout: 20

  roles:
    - role: base
    - role: docker
    - role: layout
    - role: codex_cli
    - role: deploy
    - role: ssh
    - role: firewall

  post_tasks:
    - name: Report host convergence without starting the platform
      ansible.builtin.debug:
        msg: >-
          Convergence hôte terminée. Docker est disponible, mais aucun service
          de plateforme ni aucune application n'a été démarré.
