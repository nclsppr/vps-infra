---
- name: Install or invoke the bounded PostgreSQL backup controller
  hosts: vps
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Prove the administrator and host boundary
      ansible.builtin.assert:
        that:
          - (ansible_user | default('')) == vps_admin_user
          - (ansible_user | default('')) not in ['root', vps_deploy_user]
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in vps_supported_ubuntu_releases
          - ansible_port | int == vps_ssh_port | int
          - vps_ssh_port | int == 22
          - vps_admin_authorized_keys | length > 0
          - vps_infra_revision is match('^[0-9a-f]{40}$')
          - >-
            vps_postgres_backup_state in
            ['installed', 'stopped', 'backup-now', 'rehearse-latest']
        fail_msg: >-
          The PostgreSQL backup controller requires the converged Atlas
          administrator boundary and one exact infrastructure revision.

    - name: Confirm the current connection is still responsive
      ansible.builtin.wait_for_connection:
        timeout: 20

  roles:
    - role: postgres_backup

  post_tasks:
    - name: Report the bounded PostgreSQL backup state
      ansible.builtin.debug:
        msg: >-
          PostgreSQL backup controller state is
          {{ vps_postgres_backup_state }}. The local stage is not encrypted
          and is not off-site. No public route, DNS record, application, or
          production PostgreSQL volume was changed.
