---
- name: Operate the admitted Surplasse tester pilot
  hosts: vps
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Prove the administrator and host boundary
      ansible.builtin.assert:
        that:
          - (ansible_user | default('')) == vps_admin_user
          - (ansible_user | default('')) not in ['root', vps_deploy_user]
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in vps_supported_ubuntu_releases
          - ansible_port | int == vps_ssh_port | int
          - vps_ssh_port | int == 22
          - vps_admin_authorized_keys | length > 0
          - vps_infra_revision is match('^[0-9a-f]{40}$')
          - vps_surplasse_pilot_state in ['materialize', 'status', 'apply']
        fail_msg: >-
          The pilot controller requires the converged Atlas administrator
          boundary and one exact infrastructure revision.

    - name: Confirm the current connection is still responsive
      ansible.builtin.wait_for_connection:
        timeout: 20

  roles:
    - role: surplasse_pilot

  post_tasks:
    - name: Report only the safe pilot status result
      ansible.builtin.debug:
        msg: "Surplasse pilot status: {{ vps_surplasse_pilot_safe_status }}."
      when:
        - vps_surplasse_pilot_state == 'status'
        - not ansible_check_mode

    - name: Report only the bounded pilot mutation
      ansible.builtin.debug:
        msg: >-
          Surplasse pilot operation {{ vps_surplasse_pilot_state }} completed.
          No manifest value or child-process output was logged.
      when: vps_surplasse_pilot_state != 'status'
