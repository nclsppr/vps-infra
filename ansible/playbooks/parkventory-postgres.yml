---
- name: Prepare or verify the fail-closed Parkventory database boundary
  hosts: vps
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Prove the administrator and host boundary
      ansible.builtin.assert:
        that:
          - (ansible_user | default('')) == vps_admin_user
          - (ansible_user | default('')) not in ['root', vps_deploy_user]
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in vps_supported_ubuntu_releases
          - ansible_port | int == vps_ssh_port | int
          - vps_ssh_port | int == 22
          - vps_admin_authorized_keys | length > 0
          - vps_infra_revision is match('^[0-9a-f]{40}$')
          - vps_parkventory_postgres_state in ['check', 'dry-run', 'prepare']
        fail_msg: >-
          The Parkventory database controller requires the converged Atlas
          administrator boundary and one exact infrastructure revision.

    - name: Confirm the current connection is still responsive
      ansible.builtin.wait_for_connection:
        timeout: 20

  roles:
    - role: parkventory_postgres

  post_tasks:
    - name: Report the bounded Parkventory database state
      ansible.builtin.debug:
        msg: >-
          Parkventory database state is {{ vps_parkventory_postgres_state }}.
          The Compose application and its Caddy route remain disabled. DNS and
          the static Parkventory owner were not changed.
