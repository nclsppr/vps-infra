vps_public_static_edge_monflorian_network: app_monflorian
vps_public_static_edge_monflorian_network_subnet: 172.30.40.0/24
vps_public_static_edge_monflorian_address: 172.30.40.254
vps_public_static_edge_image: >-
  ghcr.io/nclsppr/vps-infra/caddy:sha-755565642f71918134151921f8eae63935951ad6@sha256:1879be5d28d98d49522d74f4fc1bd8c176fd4e35112f757b6639151f3170f11f
vps_public_static_edge_files:
  - Caddyfile
  - compose.yaml
  - expected-images.json
  - validate-compose
vps_public_static_edge_routes:
  - monflorian.caddy
  - parkventory.caddy
  - personal.caddy
vps_public_static_edge_route_sources:
  prepare: routes-prepare
  precutover: routes-precutover
  activate: routes-activate
vps_public_static_edge_domains:
  - nicolaspieper.com
  - www.nicolaspieper.com
  - pieper.fr
  - www.pieper.fr
  - nicolas.pieper.fr
  - parkventory.com
  - www.parkventory.com
  - monflorian.com
  - www.monflorian.com
vps_public_static_edge_redirects:
  - source: www.nicolaspieper.com
    target: nicolaspieper.com
  - source: pieper.fr
    target: nicolaspieper.com
  - source: www.pieper.fr
    target: nicolaspieper.com
  - source: nicolas.pieper.fr
    target: nicolaspieper.com
  - source: www.parkventory.com
    target: parkventory.com
  - source: www.monflorian.com
    target: monflorian.com
vps_public_static_edge_direct_http_redirects:
  - source: www.nicolaspieper.com
    target: nicolaspieper.com
  - source: pieper.fr
    target: nicolaspieper.com
  - source: www.pieper.fr
    target: nicolaspieper.com
  - source: nicolas.pieper.fr
    target: nicolaspieper.com
vps_public_static_edge_pre_cutover_https_redirects:
  - source: www.nicolaspieper.com
    target: nicolaspieper.com
  - source: www.parkventory.com
    target: parkventory.com
  - source: www.monflorian.com
    target: monflorian.com
vps_public_static_edge_dns_zones:
  - zone: nicolaspieper.com
    names:
      - nicolaspieper.com
      - www.nicolaspieper.com
  - zone: pieper.fr
    names:
      - pieper.fr
      - www.pieper.fr
      - nicolas.pieper.fr
  - zone: parkventory.com
    names:
      - parkventory.com
      - www.parkventory.com
  - zone: monflorian.com
    names:
      - monflorian.com
      - www.monflorian.com
