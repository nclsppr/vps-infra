---
- name: List every service in the public edge project
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-directory
      - "{{ vps_public_static_edge_runtime_dir }}"
      - --file
      - "{{ vps_public_static_edge_runtime_dir }}/compose.yaml"
      - ps
      - --all
      - --services
  register: vps_public_static_edge_services
  changed_when: false

- name: Inspect the running Caddy container
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - "{{ vps_public_static_edge_container }}"
  register: vps_public_static_edge_inspect
  changed_when: false

- name: Compare verified Caddy bind identities
  ansible.builtin.include_tasks: inspect-bind-identities.yml
  vars:
    vps_public_static_edge_bind_inspect_stdout: >-
      {{ vps_public_static_edge_inspect.stdout }}
    vps_public_static_edge_bind_release_dir: >-
      {{ vps_public_static_edge_release_dir }}

- name: Prove the sole service uses the exact image and is healthy
  ansible.builtin.assert:
    that:
      - vps_public_static_edge_services.stdout_lines == ['caddy']
      - (vps_public_static_edge_inspect.stdout | from_json) | length == 1
      - >-
        ((vps_public_static_edge_inspect.stdout | from_json) |
         first).State.Status == 'running'
      - >-
        ((vps_public_static_edge_inspect.stdout | from_json) |
         first).State.Health.Status == 'healthy'
      - >-
        ((vps_public_static_edge_inspect.stdout | from_json) |
         first).Config.Image == vps_public_static_edge_image
      - >-
        ((vps_public_static_edge_inspect.stdout | from_json) |
         first).Image ==
        ((vps_public_static_edge_image_inspect.stdout | from_json) |
         first).Id
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks.keys() | list | sort) ==
        [vps_public_static_edge_monflorian_network,
         vps_public_static_edge_parkventory_network,
         vps_public_static_edge_network] | sort
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_monflorian_network].NetworkID) ==
        vps_public_static_edge_monflorian_network_state.Id
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_monflorian_network].IPAddress) ==
        vps_public_static_edge_monflorian_address
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_monflorian_network].IPPrefixLen | int) == 24
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_parkventory_network].NetworkID) ==
        vps_public_static_edge_parkventory_network_state.Id
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_parkventory_network].IPAddress) ==
        vps_public_static_edge_parkventory_address
      - >-
        (((vps_public_static_edge_inspect.stdout | from_json) |
          first).NetworkSettings.Networks[
            vps_public_static_edge_parkventory_network].IPPrefixLen | int) == 24
      - vps_public_static_edge_bind_identities_match | bool
    fail_msg: The Caddy-only public edge did not match its runtime contract.

- name: Wait for the HTTP listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 80
    state: started
    timeout: 10

- name: Wait for the HTTPS listener in an HTTPS edge state
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 443
    state: started
    timeout: 30
  when: vps_public_static_edge_state in ['precutover', 'activate']

- name: Probe every HTTP host from the operator network during preparation
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "{{ item }}"
    follow_redirects: none
    status_code: 200
    return_content: false
  register: vps_public_static_edge_external_http_probe
  until: vps_public_static_edge_external_http_probe.status == 200
  retries: 6
  delay: 5
  loop: "{{ vps_public_static_edge_domains }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_state == 'prepare'

- name: Refuse an unconfigured HTTP host from the operator network
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: unconfigured.invalid
    follow_redirects: none
    status_code: 404
    return_content: false
  become: false
  delegate_to: localhost

- name: Prove retained static origins directly during Papers Empire retirement
  ansible.builtin.uri:
    url: >-
      http://{{ ansible_default_ipv4.address
      }}/__vps_retirement_probe__?source=papersempire
    headers:
      Host: "{{ item }}"
    follow_redirects: none
    status_code: 308
    return_content: false
  register: vps_public_static_edge_retained_origin_probe
  until:
    - vps_public_static_edge_retained_origin_probe.status == 308
    - >-
      vps_public_static_edge_retained_origin_probe.location ==
      'https://' ~ item ~ '/__vps_retirement_probe__?source=papersempire'
  retries: 6
  delay: 5
  loop:
    - nicolaspieper.com
    - parkventory.com
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_operation == 'retire-papersempire'

- name: Refuse the retired Papers Empire hosts from the operator network
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}/"
    headers:
      Host: "{{ item }}"
    follow_redirects: none
    status_code: 404
    return_content: false
  register: vps_public_static_edge_retired_papersempire_probe
  until:
    - vps_public_static_edge_retired_papersempire_probe.status == 404
    - vps_public_static_edge_retired_papersempire_probe.server is not defined
  retries: 6
  delay: 5
  loop:
    - papersempire.com
    - www.papersempire.com
  become: false
  delegate_to: localhost

- name: Validate originless Cloudflare HTTP redirects during Personal alias retirement
  ansible.builtin.uri:
    url: >-
      http://{{ item.source
      }}/__vps_redirect_probe__?source=cloudflare-retirement
    follow_redirects: none
    status_code: 308
    return_content: false
  register: vps_public_static_edge_cloudflare_http_redirect_probe
  until:
    - vps_public_static_edge_cloudflare_http_redirect_probe.status == 308
    - >-
      vps_public_static_edge_cloudflare_http_redirect_probe.location ==
      'https://' ~ item.target ~
      '/__vps_redirect_probe__?source=cloudflare-retirement'
  retries: 36
  delay: 5
  loop: "{{ vps_public_static_edge_cloudflare_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_operation == 'retire-pieper-redirects'

- name: Validate originless Cloudflare HTTPS redirects during Personal alias retirement
  ansible.builtin.uri:
    url: >-
      https://{{ item.source
      }}/__vps_redirect_probe__?source=cloudflare-retirement
    follow_redirects: none
    status_code: 308
    return_content: false
    validate_certs: true
  register: vps_public_static_edge_cloudflare_https_redirect_probe
  until:
    - vps_public_static_edge_cloudflare_https_redirect_probe.status == 308
    - >-
      vps_public_static_edge_cloudflare_https_redirect_probe.location ==
      'https://' ~ item.target ~
      '/__vps_redirect_probe__?source=cloudflare-retirement'
  retries: 36
  delay: 5
  loop: "{{ vps_public_static_edge_cloudflare_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_operation == 'retire-pieper-redirects'

- name: Refuse retired Personal aliases directly on Atlas
  ansible.builtin.uri:
    url: >-
      http://{{ ansible_default_ipv4.address
      }}/__vps_redirect_probe__?source=atlas-retirement
    headers:
      Host: "{{ item.source }}"
    follow_redirects: none
    status_code: 404
    return_content: false
  register: vps_public_static_edge_retired_personal_alias_probe
  until:
    - vps_public_static_edge_retired_personal_alias_probe.status == 404
    - >-
      vps_public_static_edge_retired_personal_alias_probe.server is not defined
  retries: 6
  delay: 5
  loop: "{{ vps_public_static_edge_cloudflare_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_operation == 'retire-pieper-redirects'

- name: Probe pending one-hop HTTP redirects directly on Atlas before DNS cutover
  ansible.builtin.uri:
    url: >-
      http://{{ ansible_default_ipv4.address
      }}/__vps_redirect_probe__?source=atlas-precutover
    headers:
      Host: "{{ item.source }}"
    follow_redirects: none
    status_code: 308
    return_content: false
  register: vps_public_static_edge_pre_cutover_http_redirect_probe
  until:
    - vps_public_static_edge_pre_cutover_http_redirect_probe.status == 308
    - >-
      vps_public_static_edge_pre_cutover_http_redirect_probe.location ==
      'https://' ~ item.target ~
      '/__vps_redirect_probe__?source=atlas-precutover'
    - vps_public_static_edge_pre_cutover_http_redirect_probe.server is not defined
    - >-
      vps_public_static_edge_pre_cutover_http_redirect_probe.strict_transport_security
      is not defined
    - >-
      vps_public_static_edge_pre_cutover_http_redirect_probe.x_content_type_options |
      default('') == 'nosniff'
  retries: 6
  delay: 5
  loop: "{{ vps_public_static_edge_direct_http_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_state == 'precutover'

- name: Probe established HTTPS apex sites from the operator network
  ansible.builtin.uri:
    url: "https://{{ item }}/"
    follow_redirects: none
    status_code: 200
    return_content: false
    validate_certs: true
  register: vps_public_static_edge_external_https_apex_probe
  until: vps_public_static_edge_external_https_apex_probe.status == 200
  retries: 36
  delay: 5
  loop:
    - nicolaspieper.com
    - parkventory.com
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_state in ['precutover', 'activate']

- name: Probe established HTTPS redirects during pre-cutover
  ansible.builtin.uri:
    url: "https://{{ item.source }}/__vps_redirect_probe__?source=atlas-precutover"
    follow_redirects: none
    status_code: 308
    return_content: false
    validate_certs: true
  register: vps_public_static_edge_pre_cutover_https_redirect_probe
  until:
    - vps_public_static_edge_pre_cutover_https_redirect_probe.status == 308
    - >-
      vps_public_static_edge_pre_cutover_https_redirect_probe.location ==
      'https://' ~ item.target ~
      '/__vps_redirect_probe__?source=atlas-precutover'
  retries: 12
  delay: 5
  loop: "{{ vps_public_static_edge_pre_cutover_https_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when: vps_public_static_edge_state == 'precutover'

- name: Probe one-hop HTTP redirects for active Atlas hosts
  ansible.builtin.uri:
    url: "http://{{ item.source }}/__vps_redirect_probe__?source=atlas"
    follow_redirects: none
    status_code: 308
    return_content: false
  register: vps_public_static_edge_external_http_redirect_probe
  until:
    - vps_public_static_edge_external_http_redirect_probe.status == 308
    - >-
      vps_public_static_edge_external_http_redirect_probe.location ==
      'https://' ~ item.target ~ '/__vps_redirect_probe__?source=atlas'
    - vps_public_static_edge_external_http_redirect_probe.server is not defined
    - >-
      vps_public_static_edge_external_http_redirect_probe.strict_transport_security
      is not defined
    - >-
      vps_public_static_edge_external_http_redirect_probe.x_content_type_options |
      default('') == 'nosniff'
  retries: 36
  delay: 5
  loop: "{{ vps_public_static_edge_direct_http_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when:
    - vps_public_static_edge_state == 'activate'
    - >-
      vps_public_static_edge_operation in
      ['standard', 'retire-pieper-redirects']

- name: Probe one-hop HTTPS redirects for active Atlas hosts
  ansible.builtin.uri:
    url: "https://{{ item.source }}/__vps_redirect_probe__?source=atlas"
    follow_redirects: none
    status_code: 308
    return_content: false
    validate_certs: true
  register: vps_public_static_edge_external_https_redirect_probe
  until:
    - vps_public_static_edge_external_https_redirect_probe.status == 308
    - >-
      vps_public_static_edge_external_https_redirect_probe.location ==
      'https://' ~ item.target ~ '/__vps_redirect_probe__?source=atlas'
    - vps_public_static_edge_external_https_redirect_probe.server is not defined
    - >-
      vps_public_static_edge_external_https_redirect_probe.x_content_type_options |
      default('') == 'nosniff'
    - >-
      item.target != 'nicolaspieper.com' or
      vps_public_static_edge_external_https_redirect_probe.strict_transport_security
      is not defined
  retries: 36
  delay: 5
  loop: "{{ vps_public_static_edge_redirects }}"
  loop_control:
    label: "{{ item.source }}"
  become: false
  delegate_to: localhost
  when:
    - vps_public_static_edge_state == 'activate'
    - >-
      vps_public_static_edge_operation in
      ['standard', 'retire-pieper-redirects']
