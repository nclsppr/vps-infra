---
vps_platform_directories:
  - path: /srv/vps
    mode: "0755"
  - path: /srv/vps/releases
    mode: "0755"
  - path: /srv/vps/rendered
    mode: "0755"
  - path: /srv/vps/runtime
    mode: "0755"
  - path: /srv/vps/runtime/config
    mode: "0755"
  - path: /srv/vps/state
    mode: "0750"
  - path: /srv/vps/logs
    mode: "0750"

vps_static_sites:
  - personal
  - papersempire
  - parkventory

vps_static_jobs_backing_path: /run/private/vps-static-jobs
vps_static_jobs_mount_unit: 'run-private-vps\x2dstatic\x2djobs.mount'
vps_static_jobs_tmpfs_size_mib: 384
vps_static_jobs_tmpfs_inodes: 16384
