---
- name: Validate the only public ingress contract
  ansible.builtin.assert:
    that:
      - vps_ssh_port | int == 22
      - ansible_port | int == vps_ssh_port | int
      - vps_firewall_tcp_ports | map('string') | list | sort == ([vps_ssh_port | string, '80', '443'] | sort)
      - vps_firewall_udp_ports | map('string') | list == ['443']
      - vps_public_interface is match('^[a-zA-Z0-9_.:-]+$')
    fail_msg: >-
      Le pare-feu hôte autorise uniquement le port SSH actif, HTTP, HTTPS et
      HTTP/3. Le port SSH reste 22 tant qu'une migration à deux connexions
      n'est pas implémentée. Une autre exposition exige une modification revue.

- name: Check whether UFW was initialised by this repository
  ansible.builtin.stat:
    path: "{{ vps_firewall_initialised_marker }}"
  register: vps_ufw_marker

- name: Reset inherited UFW rules once on first convergence
  community.general.ufw:
    state: reset
  when: not vps_ufw_marker.stat.exists

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow only declared TCP entry points
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: vps-infra managed
  loop: "{{ vps_firewall_tcp_ports }}"

- name: Allow only declared UDP entry points
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    comment: vps-infra managed
  loop: "{{ vps_firewall_udp_ports }}"

- name: Enable low-volume firewall logging
  community.general.ufw:
    logging: low

- name: Enable UFW after the active SSH port is allowed
  community.general.ufw:
    state: enabled

- name: Install the Docker forwarded-ingress boundary
  ansible.builtin.template:
    src: docker-ingress-firewall.sh.j2
    dest: /usr/local/sbin/vps-docker-ingress-firewall
    owner: root
    group: root
    mode: "0755"
  notify: Apply Docker ingress firewall

- name: Persist Docker forwarded-ingress filtering across reboot
  ansible.builtin.template:
    src: vps-docker-ingress-firewall.service.j2
    dest: /etc/systemd/system/vps-docker-ingress-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd units
    - Apply Docker ingress firewall

- name: Create the Docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Reapply the ingress boundary after every Docker daemon start
  ansible.builtin.template:
    src: docker-vps-ingress.conf.j2
    dest: /etc/systemd/system/docker.service.d/20-vps-ingress.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd units
    - Apply Docker ingress firewall

- name: Enable the Docker ingress firewall unit
  ansible.builtin.systemd_service:
    name: vps-docker-ingress-firewall.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply all firewall handlers before recording success
  ansible.builtin.meta: flush_handlers

- name: Record successful initial UFW ownership
  ansible.builtin.copy:
    dest: "{{ vps_firewall_initialised_marker }}"
    content: "managed by vps-infra schema 1\n"
    owner: root
    group: root
    mode: "0644"

- name: Read effective UFW policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
      - verbose
  register: vps_ufw_status
  changed_when: false
  check_mode: false
  environment:
    LC_ALL: C

- name: Read every numbered UFW rule
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
      - numbered
  register: vps_ufw_numbered_status
  changed_when: false
  check_mode: false
  environment:
    LC_ALL: C

- name: Extract rules outside the exact managed ingress allowlist
  ansible.builtin.set_fact:
    vps_ufw_rule_lines: >-
      {{ vps_ufw_numbered_status.stdout_lines
         | select('match', '^\\[ *[0-9]+\\]')
         | list }}
    vps_ufw_unexpected_rule_lines: >-
      {{ vps_ufw_numbered_status.stdout_lines
         | select('match', '^\\[ *[0-9]+\\]')
         | reject('match', vps_firewall_managed_rule_pattern)
         | list }}
  when: not ansible_check_mode

- name: Assert UFW is active with the exact managed ingress allowlist
  ansible.builtin.assert:
    that:
      - "'Status: active' in vps_ufw_status.stdout"
      - "'Default: deny (incoming)' in vps_ufw_status.stdout"
      - vps_ufw_unexpected_rule_lines | length == 0
      - vps_ufw_rule_lines | select('search', '] +22/tcp(?: \\(v6\\))? +ALLOW IN ') | list | length > 0
      - vps_ufw_rule_lines | select('search', '] +80/tcp(?: \\(v6\\))? +ALLOW IN ') | list | length > 0
      - vps_ufw_rule_lines | select('search', '] +443/tcp(?: \\(v6\\))? +ALLOW IN ') | list | length > 0
      - vps_ufw_rule_lines | select('search', '] +443/udp(?: \\(v6\\))? +ALLOW IN ') | list | length > 0
    fail_msg: >-
      UFW ne correspond pas à l'allowlist exacte 22/tcp, 80/tcp, 443/tcp et
      443/udp gérée par vps-infra. Les règles inattendues ne sont jamais
      supprimées implicitement : les examiner puis les retirer explicitement.
  when: not ansible_check_mode
