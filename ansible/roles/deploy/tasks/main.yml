---
- name: Validate the bounded deployment identity
  ansible.builtin.assert:
    that:
      - vps_deploy_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - vps_deploy_user not in ['root', vps_admin_user]
      - vps_deploy_install_root == '/usr/local/libexec/vps'
      - vps_deploy_gate_path == '/usr/local/libexec/vps/forced-command'
      - vps_deploy_controller_path == '/usr/local/libexec/vps/deploy'
      - vps_deploy_static_path == '/usr/local/libexec/vps/deploy-static'
      - >-
        vps_deploy_static_gate_path ==
        '/usr/local/libexec/vps/deploy-static-live-gate'
      - >-
        vps_deploy_application_path ==
        '/usr/local/libexec/vps/deploy-application'
      - >-
        vps_deploy_application_gate_path ==
        '/usr/local/libexec/vps/deploy-application-live-gate'
      - >-
        vps_surplasse_dns_materializer_path ==
        '/usr/local/libexec/vps/materialize-surplasse-dns-secrets'
      - >-
        vps_surplasse_pilot_materializer_path ==
        '/usr/local/libexec/vps/materialize-surplasse-pilot-manifest'
      - >-
        vps_surplasse_pilot_controller_path ==
        '/usr/local/libexec/vps/surplasse-pilot-bootstrap'
      - >-
        vps_monflorian_secret_materializer_path ==
        '/usr/local/libexec/vps/materialize-monflorian-secret'
      - >-
        vps_smtp_materializer_path ==
        '/usr/local/libexec/vps/materialize-smtp-secrets'
      - vps_deploy_schema_root == '/usr/local/share/vps-infra/schemas'
      - vps_deploy_repository_dir == '/srv/vps/repository'
      - vps_deploy_repository_url == 'https://github.com/nclsppr/vps-infra.git'
      - vps_deploy_revision_path == '/usr/local/share/vps-infra/controller-revision'
      - vps_deploy_state_dir == '/var/lib/vps-controller'
      - >-
        vps_deploy_key_recovery_marker_dir ==
        '/var/lib/vps-controller/deploy-key-recovery-nonces'
      - vps_static_state_dir == '/var/lib/vps-static'
      - vps_static_recovery_unit == 'vps-static-recover.service'
      - vps_application_root == '/srv/applications'
      - vps_application_config_dir == '/etc/vps/applications'
      - vps_application_state_dir == '/var/lib/vps-application'
      - vps_application_recovery_unit == 'vps-application-recover.service'
      - vps_deploy_production_marker == '/etc/vps/production-enabled'
      - vps_deploy_git_sha_length | int == 40
      - vps_infra_revision is match('^[0-9a-f]{40}$')
      - vps_gh_version == '2.97.0'
      - vps_gh_install_path == '/usr/local/bin/gh'
      - vps_gh_cache_root == '/var/cache/vps-infra/gh'
      - vps_gh_archives.keys() | list | sort == ['aarch64', 'x86_64']
      - ansible_architecture in vps_gh_archives
      - >-
        vps_gh_archives[ansible_architecture].release_architecture in
        ['amd64', 'arm64']
      - >-
        vps_gh_archives[ansible_architecture].archive_sha256 is
        match('^[0-9a-f]{64}$')
      - >-
        vps_gh_archives[ansible_architecture].binary_sha256 is
        match('^[0-9a-f]{64}$')
      - >-
        vps_deploy_executables | list | sort ==
        ['check-public-safe', 'deploy', 'deploy-application',
         'deploy-application-live-gate', 'deploy-static',
         'deploy-static-live-gate', 'doctor', 'forced-command',
         'parse-forced-command', 'plan-digests', 'reconcile',
         'validate-compose', 'validate-release', 'verify-github-evidence',
         'verify-state']
      - >-
        vps_deploy_root_helpers ==
        ['materialize-monflorian-secret',
         'materialize-smtp-secrets',
         'materialize-surplasse-dns-secrets',
         'materialize-surplasse-pilot-manifest',
         'surplasse-pilot-bootstrap']
      - not (vps_live_apply_enabled | bool)
    fail_msg: "Le contrat du compte ou de la commande de déploiement a dérivé."

- name: Refuse convergence without a bounded deployment key set
  ansible.builtin.assert:
    that:
      - vps_deploy_authorized_keys is sequence
      - vps_deploy_authorized_keys is not string
      - vps_deploy_authorized_keys is not mapping
      - vps_deploy_authorized_keys | length > 0
      - vps_deploy_authorized_keys | length <= 4
      - >-
        vps_deploy_authorized_keys | unique | length ==
        vps_deploy_authorized_keys | length
    fail_msg: >-
      Refus de vider les clés du compte deploy : déclarer entre une et quatre
      clés publiques uniques avant toute convergence du rôle.

- name: Validate the one-use deployment key recovery nonce contract
  ansible.builtin.assert:
    that:
      - vps_deploy_key_recovery_nonce is string
      - >-
        vps_deploy_key_recovery_nonce == '' or
        vps_deploy_key_recovery_nonce is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Le nonce de récupération deploy doit rester vide en fonctionnement
      normal ou contenir exactement 64 caractères hexadécimaux minuscules.
  no_log: true

- name: Validate deployment public key syntax
  ansible.builtin.assert:
    that:
      - >-
        item is match('^(ssh-ed25519|sk-ssh-ed25519@openssh.com|ecdsa-sha2-nistp256|sk-ecdsa-sha2-nistp256@openssh.com|ssh-rsa) [A-Za-z0-9+/=]+(?: .*)?$')
      - "'\\n' not in item"
      - "'\\r' not in item"
    fail_msg: "Clé publique deploy invalide ou contenant déjà des options SSH."
  loop: "{{ vps_deploy_authorized_keys }}"
  loop_control:
    label: "clé deploy déclarée"

- name: Cryptographically parse deployment public keys
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh-keygen
      - -l
      - -E
      - sha256
      - -f
      - /dev/stdin
    stdin: "{{ item }}\n"
    stdin_add_newline: false
  check_mode: false
  changed_when: false
  loop: "{{ vps_deploy_authorized_keys }}"
  loop_control:
    label: "clé deploy déclarée"

- name: Inspect whether the deployment account already exists
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ vps_deploy_user }}"
  register: deploy_account_lookup
  check_mode: false
  changed_when: false
  failed_when: deploy_account_lookup.rc not in [0, 2]

- name: Inspect the installed forced-command key file
  ansible.builtin.stat:
    path: "/home/{{ vps_deploy_user }}/.ssh/authorized_keys"
  register: deploy_authorized_keys_stat

- name: Refuse a non-regular installed forced-command key path
  ansible.builtin.assert:
    that:
      - >-
        not deploy_authorized_keys_stat.stat.exists or
        deploy_authorized_keys_stat.stat.isreg
      - >-
        not deploy_authorized_keys_stat.stat.exists or
        not deploy_authorized_keys_stat.stat.islnk
      - >-
        not deploy_authorized_keys_stat.stat.exists or
        deploy_authorized_keys_stat.stat.pw_name == vps_deploy_user
      - >-
        not deploy_authorized_keys_stat.stat.exists or
        deploy_authorized_keys_stat.stat.gr_name == vps_deploy_user
      - >-
        not deploy_authorized_keys_stat.stat.exists or
        deploy_authorized_keys_stat.stat.mode == '0600'
    fail_msg: >-
      Refus de remplacer un authorized_keys deploy qui n'est pas un fichier
      régulier, non symbolique, possédé par deploy et protégé en mode 0600.

- name: Read the installed forced-command keys without changing them
  ansible.builtin.slurp:
    src: "/home/{{ vps_deploy_user }}/.ssh/authorized_keys"
  register: deploy_authorized_keys_file
  when: deploy_authorized_keys_stat.stat.exists

- name: Normalize installed and desired deployment key records
  ansible.builtin.set_fact:
    deploy_installed_key_lines: >-
      {{
        (deploy_authorized_keys_file.content | default('') | b64decode).
        splitlines() | map('trim') | reject('equalto', '') | list
      }}
    deploy_desired_key_identities: >-
      {{
        vps_deploy_authorized_keys | map('trim') |
        map('regex_replace', '^([^ ]+ [^ ]+)(?: .*)?$', '\1') | list
      }}
    deploy_first_key_install: >-
      {{
        deploy_account_lookup.rc == 2 and
        not deploy_authorized_keys_stat.stat.exists
      }}

- name: Extract only exact installed forced-command key identities
  ansible.builtin.set_fact:
    deploy_installed_key_identities: >-
      {{
        deploy_installed_key_lines |
        select(
          'match',
          '^restrict,command="/usr/local/libexec/vps/forced-command" '
        ) |
        map(
          'regex_replace',
          '^restrict,command="/usr/local/libexec/vps/forced-command" '
          ~ '([^ ]+ [^ ]+)(?: .*)?$',
          '\1'
        ) | list
      }}

- name: Refuse duplicate desired deployment key identities
  ansible.builtin.assert:
    that:
      - >-
        deploy_desired_key_identities | unique | length ==
        deploy_desired_key_identities | length
    fail_msg: >-
      Refus de converger deux déclarations de la même clé deploy avec des
      commentaires différents.

- name: Measure overlap with a currently installed deployment key
  ansible.builtin.set_fact:
    deploy_key_overlap_count: >-
      {{
        deploy_installed_key_identities |
        intersect(deploy_desired_key_identities) | length
      }}

- name: Derive the one-use recovery marker without exposing its nonce
  ansible.builtin.set_fact:
    deploy_key_recovery_marker_path: >-
      {{
        vps_deploy_key_recovery_marker_dir ~ '/' ~
        (vps_deploy_key_recovery_nonce | hash('sha256'))
      }}
  when: vps_deploy_key_recovery_nonce | length > 0
  no_log: true

- name: Create the private deployment key recovery marker directory
  ansible.builtin.file:
    path: "{{ vps_deploy_key_recovery_marker_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: vps_deploy_key_recovery_nonce | length > 0

- name: Inspect whether the recovery nonce was already consumed
  ansible.builtin.stat:
    path: "{{ deploy_key_recovery_marker_path }}"
  register: deploy_key_recovery_marker_stat
  when: vps_deploy_key_recovery_nonce | length > 0
  no_log: true

- name: Authorize only first install overlap or explicit unused recovery
  ansible.builtin.assert:
    that:
      - >-
        deploy_first_key_install or
        deploy_key_overlap_count | int > 0 or
        vps_deploy_key_recovery_nonce | length == 64
      - >-
        vps_deploy_key_recovery_nonce | length == 0 or
        (
          not deploy_first_key_install and
          deploy_key_overlap_count | int == 0 and
          vps_deploy_authorized_keys | length == 1
        )
      - >-
        vps_deploy_key_recovery_nonce | length == 0 or
        not deploy_key_recovery_marker_stat.stat.exists
    fail_msg: >-
      Refus de remplacer toutes les clés deploy prouvées. Conserver au moins
      une clé installée pendant une rotation normale. Une perte totale exige
      un nouveau nonce de récupération explicite et encore inutilisé.
  register: deploy_key_rotation_guard
  no_log: true

- name: Consume the exceptional deployment key recovery nonce
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import os, sys;
        descriptor = os.open(
          sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600
        );
        marker = os.fdopen(descriptor, 'w', encoding='utf-8');
        marker.write(sys.argv[2]);
        marker.flush();
        os.fsync(marker.fileno());
        marker.close();
        directory = os.open(
          os.path.dirname(sys.argv[1]), os.O_RDONLY | os.O_DIRECTORY
        );
        os.fsync(directory);
        os.close(directory)
      - "{{ deploy_key_recovery_marker_path }}"
      - |
        revision={{ vps_infra_revision }}
        installed={{ deploy_installed_key_identities | sort | join(',') }}
        desired={{ deploy_desired_key_identities | sort | join(',') }}
  register: deploy_key_recovery_marker_creation
  changed_when: true
  when:
    - vps_deploy_key_recovery_nonce | length > 0
    - not ansible_check_mode
  no_log: true

- name: Refuse a raced or reused deployment key recovery nonce
  ansible.builtin.assert:
    that:
      - >-
        ansible_check_mode or
        deploy_key_recovery_marker_creation.changed
    fail_msg: >-
      Refus de continuer : le nonce de récupération deploy n'a pas été consommé
      de manière exclusive. Générer un nouveau nonce après investigation.
  when: vps_deploy_key_recovery_nonce | length > 0
  no_log: true

- name: Create the deployment account with a valid shell
  ansible.builtin.user:
    name: "{{ vps_deploy_user }}"
    comment: Forced-command deployment trigger
    shell: /bin/bash
    create_home: true
    groups: ""
    append: false
    password_lock: true
    state: present

- name: Create the deployment SSH directory
  ansible.builtin.file:
    path: "/home/{{ vps_deploy_user }}/.ssh"
    state: directory
    owner: "{{ vps_deploy_user }}"
    group: "{{ vps_deploy_user }}"
    mode: "0700"

- name: Install forced-command deployment keys
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ vps_deploy_user }}/.ssh/authorized_keys"
    owner: "{{ vps_deploy_user }}"
    group: "{{ vps_deploy_user }}"
    mode: "0600"
    validate: >-
      /bin/sh -c 'set -eu;
      file=$1;
      count=0;
      prefix="restrict,command=\"/usr/local/libexec/vps/forced-command\" ";
      while IFS= read -r line || [ -n "$line" ]; do
        [ -n "$line" ] || exit 1;
        case "$line" in
          "$prefix"*) key=${line#"$prefix"} ;;
          *) exit 1 ;;
        esac;
        key_type=${key%% *};
        key_rest=${key#* };
        key_blob=${key_rest%% *};
        printf "%b %b\n" "$key_type" "$key_blob" |
          /usr/bin/ssh-keygen -l -E sha256 -f /dev/stdin >/dev/null;
        count=$((count + 1));
        [ "$count" -le 4 ] || exit 1;
      done < "$file";
      [ "$count" -ge 1 ]'
      vps-deploy-authorized-keys-validator %s

- name: Create root-owned controller directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vps_deploy_install_root }}"
      mode: "0755"
    - path: "{{ vps_deploy_install_root }}/lib"
      mode: "0755"
    - path: "{{ vps_deploy_schema_root }}"
      mode: "0755"
    - path: "{{ vps_deploy_repository_dir }}"
      mode: "0700"
    - path: "{{ vps_deploy_state_dir }}"
      mode: "0700"
    - path: "{{ vps_static_state_dir }}"
      mode: "0700"
    - path: "{{ vps_static_state_dir }}/active"
      mode: "0700"
    - path: "{{ vps_static_state_dir }}/inventories"
      mode: "0700"
    - path: "{{ vps_static_state_dir }}/quarantine"
      mode: "0700"
    - path: "{{ vps_static_state_dir }}/transactions"
      mode: "0700"
    - path: "{{ vps_application_root }}"
      mode: "0755"
    - path: "{{ vps_application_root }}/surplasse"
      mode: "0755"
    - path: "{{ vps_application_root }}/surplasse/releases"
      mode: "0755"
    - path: "{{ vps_application_root }}/parkventory"
      mode: "0755"
    - path: "{{ vps_application_root }}/parkventory/releases"
      mode: "0755"
    - path: "{{ vps_application_root }}/monflorian"
      mode: "0755"
    - path: "{{ vps_application_root }}/monflorian/releases"
      mode: "0755"
    - path: "{{ vps_application_config_dir }}"
      mode: "0700"
    - path: /etc/vps/secrets/monflorian
      mode: "0700"
    - path: "{{ vps_application_state_dir }}"
      mode: "0700"
    - path: "{{ vps_application_state_dir }}/active"
      mode: "0700"
    - path: "{{ vps_application_state_dir }}/inventories"
      mode: "0700"
    - path: "{{ vps_application_state_dir }}/quarantine"
      mode: "0700"
    - path: "{{ vps_application_state_dir }}/transactions"
      mode: "0700"
    - path: "{{ vps_application_state_dir }}/handoffs"
      mode: "0700"
    - path: "{{ vps_gh_cache_root }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Validate the private Mon Florian secret input contracts
  ansible.builtin.assert:
    that:
      - vps_monflorian_adopt_existing_ids is sequence
      - vps_monflorian_adopt_existing_ids is not string
      - vps_monflorian_adopt_existing_ids is not mapping
      - >-
        vps_monflorian_adopt_existing_ids | unique | length ==
        vps_monflorian_adopt_existing_ids | length
      - >-
        vps_monflorian_adopt_existing_ids |
        difference(['monflorian.openai-api-key',
                    'monflorian.private-access']) | length == 0
      - >-
        'monflorian.openai-api-key' not in
        vps_monflorian_adopt_existing_ids or
        vps_monflorian_openai_api_key_source == ''
      - >-
        'monflorian.private-access' not in
        vps_monflorian_adopt_existing_ids or
        vps_monflorian_private_access_source == ''
      - vps_monflorian_openai_api_key_source is string
      - "'\n' not in vps_monflorian_openai_api_key_source"
      - "'\r' not in vps_monflorian_openai_api_key_source"
      - >-
        vps_monflorian_openai_api_key_source == '' or
        vps_monflorian_openai_api_key_source is match('^/')
      - vps_monflorian_private_access_source is string
      - "'\n' not in vps_monflorian_private_access_source"
      - "'\r' not in vps_monflorian_private_access_source"
      - >-
        vps_monflorian_private_access_source == '' or
        vps_monflorian_private_access_source is match('^/')
      - >-
        vps_monflorian_openai_api_key_path ==
        '/etc/vps/secrets/monflorian/monflorian-openai-api-key'
      - >-
        vps_monflorian_private_access_path ==
        '/etc/vps/secrets/monflorian/monflorian-private-access.caddy'
    fail_msg: The private Mon Florian secret input contract is invalid.
  no_log: true

- name: Select the pinned GitHub CLI archive for this architecture
  ansible.builtin.set_fact:
    vps_gh_archive: "{{ vps_gh_archives[ansible_architecture] }}"
    vps_gh_extraction_dir: >-
      {{ vps_gh_cache_root ~ '/' ~ vps_gh_version ~ '-' ~
         vps_gh_archives[ansible_architecture].release_architecture }}
    vps_gh_archive_path: >-
      {{ vps_gh_cache_root ~ '/gh_' ~ vps_gh_version ~ '_linux_' ~
         vps_gh_archives[ansible_architecture].release_architecture ~ '.tar.gz' }}
    vps_gh_download_url: >-
      {{ 'https://github.com/cli/cli/releases/download/v' ~ vps_gh_version ~
         '/gh_' ~ vps_gh_version ~ '_linux_' ~
         vps_gh_archives[ansible_architecture].release_architecture ~ '.tar.gz' }}

- name: Create the versioned GitHub CLI extraction directory
  ansible.builtin.file:
    path: "{{ vps_gh_extraction_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned GitHub CLI release archive
  ansible.builtin.get_url:
    url: "{{ vps_gh_download_url }}"
    dest: "{{ vps_gh_archive_path }}"
    checksum: "sha256:{{ vps_gh_archive.archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: not ansible_check_mode

- name: Extract the verified GitHub CLI archive
  ansible.builtin.unarchive:
    src: "{{ vps_gh_archive_path }}"
    dest: "{{ vps_gh_extraction_dir }}"
    owner: root
    group: root
    mode: "go-w"
    remote_src: true
    creates: >-
      {{ vps_gh_extraction_dir ~ '/gh_' ~ vps_gh_version ~ '_linux_' ~
         vps_gh_archive.release_architecture ~ '/bin/gh' }}
  when: not ansible_check_mode

- name: Inspect the extracted GitHub CLI executable
  ansible.builtin.stat:
    path: >-
      {{ vps_gh_extraction_dir ~ '/gh_' ~ vps_gh_version ~ '_linux_' ~
         vps_gh_archive.release_architecture ~ '/bin/gh' }}
    follow: false
    checksum_algorithm: sha256
  register: vps_gh_extracted
  when: not ansible_check_mode

- name: Verify the extracted GitHub CLI executable checksum
  ansible.builtin.assert:
    that:
      - vps_gh_extracted.stat.exists
      - vps_gh_extracted.stat.isreg
      - not vps_gh_extracted.stat.islnk
      - vps_gh_extracted.stat.uid == 0
      - vps_gh_extracted.stat.gid == 0
      - not vps_gh_extracted.stat.wgrp
      - not vps_gh_extracted.stat.woth
      - vps_gh_extracted.stat.checksum == vps_gh_archive.binary_sha256
    fail_msg: "The extracted GitHub CLI executable does not match the approved checksum."
  when: not ansible_check_mode

- name: Install the verified GitHub CLI executable
  ansible.builtin.copy:
    src: >-
      {{ vps_gh_extraction_dir ~ '/gh_' ~ vps_gh_version ~ '_linux_' ~
         vps_gh_archive.release_architecture ~ '/bin/gh' }}
    dest: "{{ vps_gh_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Read the installed GitHub CLI version
  ansible.builtin.command:
    argv:
      - "{{ vps_gh_install_path }}"
      - version
  register: vps_gh_version_output
  changed_when: false
  when: not ansible_check_mode

- name: Prove the installed GitHub CLI version
  ansible.builtin.assert:
    that:
      - >-
        vps_gh_version_output.stdout is
        regex('(?m)^gh version\\s+' ~ (vps_gh_version | regex_escape) ~ '(?:\\s|$)')
    fail_msg: "The installed GitHub CLI version differs from the approved version."
  when: not ansible_check_mode

- name: Initialise the fixed public infrastructure mirror at the requested commit
  ansible.builtin.git:
    repo: "{{ vps_deploy_repository_url }}"
    dest: "{{ vps_deploy_repository_dir }}"
    version: "{{ vps_infra_revision }}"
    clone: true
    update: true
    force: false
    recursive: false
    track_submodules: false
    single_branch: true
  environment:
    GIT_ALLOW_PROTOCOL: https
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_CONFIG_SYSTEM: /dev/null
    GIT_TERMINAL_PROMPT: "0"

- name: Read the infrastructure mirror origin
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - "{{ vps_deploy_repository_dir }}"
      - remote
      - get-url
      - origin
  register: vps_deploy_repository_origin
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Prove the fixed origin and deployable remote reference
  when: not ansible_check_mode
  block:
    - name: Assert the mirror origin is not operator-controlled input
      ansible.builtin.assert:
        that:
          - vps_deploy_repository_origin.stdout == vps_deploy_repository_url
        fail_msg: "Le miroir vps-infra pointe vers une origine non autorisée."

    - name: Verify origin main exists in the mirror
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ vps_deploy_repository_dir }}"
          - show-ref
          - --verify
          - --quiet
          - refs/remotes/origin/main
      changed_when: false

    - name: Read the checked-out infrastructure revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ vps_deploy_repository_dir }}"
          - rev-parse
          - HEAD
      register: vps_deploy_repository_head
      changed_when: false

    - name: Prove the requested commit is checked out exactly
      ansible.builtin.assert:
        that:
          - vps_deploy_repository_head.stdout == vps_infra_revision
        fail_msg: "Le miroir n'est pas positionné sur le SHA vps-infra demandé."

    - name: Prove the requested commit belongs to origin main
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ vps_deploy_repository_dir }}"
          - merge-base
          - --is-ancestor
          - "{{ vps_infra_revision }}"
          - refs/remotes/origin/main
      changed_when: false

    - name: Detect local modifications in the infrastructure mirror
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ vps_deploy_repository_dir }}"
          - status
          - --porcelain
          - --untracked-files=all
      register: vps_deploy_repository_status
      changed_when: false

    - name: Refuse a modified infrastructure mirror
      ansible.builtin.assert:
        that:
          - vps_deploy_repository_status.stdout == ''
        fail_msg: "Le miroir vps-infra contient des modifications locales."

- name: Inspect controller source files in the proven mirror
  ansible.builtin.stat:
    path: "{{ vps_deploy_repository_dir }}/scripts/{{ item }}"
    follow: false
  register: vps_deploy_source_executables
  loop: "{{ vps_deploy_executables }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Refuse missing, non-regular or symlinked controller sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: "La source contrôleur {{ item.item }} n'est pas un fichier régulier."
  loop: "{{ vps_deploy_source_executables.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Inspect root-only controller helper sources in the proven mirror
  ansible.builtin.stat:
    path: "{{ vps_deploy_repository_dir }}/scripts/{{ item }}"
    follow: false
  register: vps_deploy_source_root_helpers
  loop: "{{ vps_deploy_root_helpers }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Refuse unsafe root-only controller helper sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: "The root-only helper source {{ item.item }} is unsafe."
  loop: "{{ vps_deploy_source_root_helpers.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Inspect policy and schema sources in the proven mirror
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: vps_deploy_source_support_files
  loop:
    - "{{ vps_deploy_repository_dir }}/scripts/lib/release_policy.py"
    - "{{ vps_deploy_repository_dir }}/scripts/lib/platform_proof.py"
    - "{{ vps_deploy_repository_dir }}/scripts/lib/platform_integration.py"
    - "{{ vps_deploy_repository_dir }}/scripts/lib/application_release.py"
    - "{{ vps_deploy_repository_dir }}/scripts/lib/application_bundle.py"
    - "{{ vps_deploy_repository_dir }}/schemas/production-release.schema.json"
  when: not ansible_check_mode

- name: Refuse missing, non-regular or symlinked policy sources
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: "La source de confiance {{ item.item }} n'est pas un fichier régulier."
  loop: "{{ vps_deploy_source_support_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Install reviewed controller executables from the proven mirror
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/{{ item }}"
    dest: "{{ vps_deploy_install_root }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop: "{{ vps_deploy_executables }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Install root-only controller helpers from the proven mirror
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/{{ item }}"
    dest: "{{ vps_deploy_install_root }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0500"
  loop: "{{ vps_deploy_root_helpers }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Install the dependency-free release policy module from the proven mirror
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/lib/release_policy.py"
    dest: "{{ vps_deploy_install_root }}/lib/release_policy.py"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Install the canonical platform proof module from the proven mirror
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/lib/platform_proof.py"
    dest: "{{ vps_deploy_install_root }}/lib/platform_proof.py"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Install the platform integration verifier for the static materializer
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/lib/platform_integration.py"
    dest: "{{ vps_deploy_install_root }}/lib/platform_integration.py"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Install the immutable application release policy
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/lib/application_release.py"
    dest: "{{ vps_deploy_install_root }}/lib/application_release.py"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Install the immutable application integration policy
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/scripts/lib/application_bundle.py"
    dest: "{{ vps_deploy_install_root }}/lib/application_bundle.py"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Install the production release schema from the proven mirror
  ansible.builtin.copy:
    src: "{{ vps_deploy_repository_dir }}/schemas/production-release.schema.json"
    dest: "{{ vps_deploy_schema_root }}/production-release.schema.json"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Record the exact installed controller revision
  ansible.builtin.copy:
    content: "{{ vps_infra_revision }}\n"
    dest: "{{ vps_deploy_revision_path }}"
    owner: root
    group: root
    mode: "0444"
  when: not ansible_check_mode

- name: Keep the live applicator absent in this non-activating tranche
  ansible.builtin.file:
    path: "{{ vps_deploy_install_root }}/apply-release"
    state: absent

- name: Keep production activation explicitly disabled
  ansible.builtin.file:
    path: "{{ vps_deploy_production_marker }}"
    state: absent

- name: Install the static transaction recovery unit
  ansible.builtin.template:
    src: vps-static-recover.service.j2
    dest: "/etc/systemd/system/{{ vps_static_recovery_unit }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the application transaction recovery unit
  ansible.builtin.template:
    src: vps-application-recover.service.j2
    dest: "/etc/systemd/system/{{ vps_application_recovery_unit }}"
    owner: root
    group: root
    mode: "0644"

- name: Allow only the bounded root-owned deployment executables through sudo
  ansible.builtin.template:
    src: deploy.sudoers.j2
    dest: "/etc/sudoers.d/91-{{ vps_deploy_user }}-deploy"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Read deployment account groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -nG
      - "{{ vps_deploy_user }}"
  register: vps_deploy_groups
  changed_when: false
  check_mode: false

- name: Prove deploy has no direct Docker or sudo capability
  ansible.builtin.assert:
    that:
      - "'docker' not in vps_deploy_groups.stdout.split()"
      - "'sudo' not in vps_deploy_groups.stdout.split()"
      - vps_deploy_groups.stdout.split() == [vps_deploy_user]
    fail_msg: >-
      Le compte deploy possède un groupe supplémentaire. Il doit uniquement
      pouvoir atteindre le contrôleur root-owned via sa règle sudoers bornée.

- name: Inspect installed controller trust-root files
  ansible.builtin.stat:
    path: "{{ item }}"
  register: vps_deploy_trust_root
  loop:
    - "{{ vps_deploy_gate_path }}"
    - "{{ vps_deploy_controller_path }}"
    - "{{ vps_deploy_static_gate_path }}"
    - "{{ vps_deploy_application_path }}"
    - "{{ vps_deploy_application_gate_path }}"
    - "{{ vps_surplasse_dns_materializer_path }}"
    - "{{ vps_surplasse_pilot_materializer_path }}"
    - "{{ vps_surplasse_pilot_controller_path }}"
    - "/etc/systemd/system/{{ vps_static_recovery_unit }}"
    - "/etc/systemd/system/{{ vps_application_recovery_unit }}"
    - "{{ vps_deploy_install_root }}/lib/release_policy.py"
    - "{{ vps_deploy_install_root }}/lib/platform_proof.py"
    - "{{ vps_deploy_install_root }}/lib/platform_integration.py"
    - "{{ vps_deploy_install_root }}/lib/application_release.py"
    - "{{ vps_deploy_install_root }}/lib/application_bundle.py"
    - "{{ vps_deploy_schema_root }}/production-release.schema.json"
    - "{{ vps_deploy_revision_path }}"
  when: not ansible_check_mode

- name: Prove controller files are root-owned and not writable by deploy
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.uid == 0
      - item.stat.gid == 0
      - not item.stat.wgrp
      - not item.stat.woth
    fail_msg: "Le fichier de confiance {{ item.item }} n'est pas protégé."
  loop: "{{ vps_deploy_trust_root.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Inspect every installed controller executable
  ansible.builtin.stat:
    path: "{{ vps_deploy_install_root }}/{{ item }}"
  register: vps_deploy_installed_executables
  loop: "{{ vps_deploy_executables }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Prove every controller executable is a protected root-owned file
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.executable
      - item.stat.uid == 0
      - item.stat.gid == 0
      - not item.stat.wgrp
      - not item.stat.woth
    fail_msg: "L'exécutable de confiance {{ item.item }} n'est pas protégé."
  loop: "{{ vps_deploy_installed_executables.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Inspect every installed root-only controller helper
  ansible.builtin.stat:
    path: "{{ vps_deploy_install_root }}/{{ item }}"
  register: vps_deploy_installed_root_helpers
  loop: "{{ vps_deploy_root_helpers }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Prove every root-only controller helper is protected
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.executable
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode == '0500'
    fail_msg: "The root-only helper {{ item.item }} is not protected."
  loop: "{{ vps_deploy_installed_root_helpers.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Preflight each selected Mon Florian existing-file adoption
  ansible.builtin.command:
    argv:
      - "{{ vps_monflorian_secret_materializer_path }}"
      - --check-adopt-existing
      - "{{ item }}"
  register: vps_monflorian_secret_adoption_preflight
  loop: "{{ vps_monflorian_adopt_existing_ids }}"
  loop_control:
    label: "{{ item }}"
  check_mode: false
  changed_when: false

- name: Adopt each explicitly selected existing Mon Florian secret
  ansible.builtin.command:
    argv:
      - "{{ vps_monflorian_secret_materializer_path }}"
      - --adopt-existing
      - "{{ item }}"
  register: vps_monflorian_secret_adoption
  loop: "{{ vps_monflorian_adopt_existing_ids }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode
  changed_when: >-
    (vps_monflorian_secret_adoption.stdout | from_json).changed | bool

- name: Materialize each supplied Mon Florian singleton secret
  ansible.builtin.include_tasks: materialize-monflorian-secret.yml
  loop:
    - identifier: monflorian.openai-api-key
      source: "{{ vps_monflorian_openai_api_key_source }}"
    - identifier: monflorian.private-access
      source: "{{ vps_monflorian_private_access_source }}"
  loop_control:
    loop_var: vps_monflorian_secret_input
    label: "{{ vps_monflorian_secret_input.identifier }}"
  when:
    - not ansible_check_mode
    - vps_monflorian_secret_input.source | length > 0
  no_log: true

- name: Audit Mon Florian secret metadata and generation markers
  ansible.builtin.command:
    argv:
      - "{{ vps_monflorian_secret_materializer_path }}"
      - --check
  register: vps_monflorian_secret_audit
  check_mode: false
  changed_when: false

- name: Prove the public Mon Florian secret audit contract
  ansible.builtin.assert:
    that:
      - not ((vps_monflorian_secret_audit.stdout | from_json).changed | bool)
      - (vps_monflorian_secret_audit.stdout | from_json).mode == 'check'
      - >-
        (vps_monflorian_secret_audit.stdout | from_json).entries.keys() |
        list | sort ==
        ['monflorian.openai-api-key', 'monflorian.private-access']
    fail_msg: The public Mon Florian secret audit contract is invalid.

- name: Enable static transaction recovery at boot
  ansible.builtin.systemd_service:
    name: "{{ vps_static_recovery_unit }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable application transaction recovery at boot
  ansible.builtin.systemd_service:
    name: "{{ vps_application_recovery_unit }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
