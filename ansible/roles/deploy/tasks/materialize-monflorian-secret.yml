---
- name: Stage and materialize one private Mon Florian source
  no_log: true
  block:
    - name: Create a private transient Mon Florian source directory
      ansible.builtin.tempfile:
        path: /run
        prefix: vps-monflorian-secret-
        state: directory
      register: vps_monflorian_secret_stage

    - name: Stage the private Mon Florian source
      ansible.builtin.copy:
        src: "{{ vps_monflorian_secret_input.source }}"
        dest: "{{ vps_monflorian_secret_stage.path }}/source"
        owner: root
        group: root
        mode: "0400"
        force: true
        backup: false

    - name: Materialize the staged Mon Florian singleton file set
      ansible.builtin.command:
        argv:
          - "{{ vps_monflorian_secret_materializer_path }}"
          - --install-from
          - "{{ vps_monflorian_secret_stage.path }}/source"
          - "{{ vps_monflorian_secret_input.identifier }}"
      register: vps_monflorian_secret_install
      changed_when: >-
        (vps_monflorian_secret_install.stdout | from_json).changed | bool
  always:
    - name: Remove the transient Mon Florian source directory
      ansible.builtin.file:
        path: "{{ vps_monflorian_secret_stage.path }}"
        state: absent
      when: vps_monflorian_secret_stage is defined
