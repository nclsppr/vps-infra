---
- name: Start the private Codex App Server for verified lifecycle
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - start
      - "{{ vps_codex_app_server_unit }}"
  changed_when: false

- name: Wait for the private Codex App Server socket
  ansible.builtin.wait_for:
    path: "{{ vps_codex_app_server_socket }}"
    state: present
    timeout: 15

- name: Inspect the private Codex App Server socket
  ansible.builtin.stat:
    path: "{{ vps_codex_app_server_socket }}"
    follow: false
  register: vps_codex_app_server_socket_state

- name: Read effective private Codex App Server properties
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "{{ vps_codex_app_server_unit }}"
      - --property=ActiveState
      - --property=SubState
      - --property=UnitFileState
      - --property=User
      - --property=Group
      - --property=Slice
      - --property=Restart
      - --property=NoNewPrivileges
      - --property=PrivateDevices
      - --property=ProtectHome
      - --property=ProtectSystem
      - --property=MainPID
      - --property=FragmentPath
      - --property=DropInPaths
      - --property=ExecCondition
      - --property=ExecStart
      - --property=Environment
      - --property=RestrictAddressFamilies
      - --property=SocketBindDeny
  register: vps_codex_app_server_properties
  changed_when: false

- name: Prove the private Codex App Server lifecycle and identity
  ansible.builtin.assert:
    that:
      - vps_codex_app_server_socket_state.stat.issock
      - not vps_codex_app_server_socket_state.stat.islnk
      - vps_codex_app_server_socket_state.stat.pw_name == vps_codex_user
      - vps_codex_app_server_socket_state.stat.gr_name == vps_codex_group
      - vps_codex_app_server_socket_state.stat.mode == '0600'
      - "'ActiveState=active' in vps_codex_app_server_properties.stdout_lines"
      - "'SubState=running' in vps_codex_app_server_properties.stdout_lines"
      - "'UnitFileState=enabled' in vps_codex_app_server_properties.stdout_lines"
      - "'User=' ~ vps_codex_user in vps_codex_app_server_properties.stdout_lines"
      - "'Group=' ~ vps_codex_group in vps_codex_app_server_properties.stdout_lines"
      - "'Slice=atlas-codex.slice' in vps_codex_app_server_properties.stdout_lines"
      - "'Restart=always' in vps_codex_app_server_properties.stdout_lines"
      - "'NoNewPrivileges=yes' in vps_codex_app_server_properties.stdout_lines"
      - "'PrivateDevices=yes' in vps_codex_app_server_properties.stdout_lines"
      - "'ProtectHome=yes' in vps_codex_app_server_properties.stdout_lines"
      - "'ProtectSystem=strict' in vps_codex_app_server_properties.stdout_lines"
      - >-
        'FragmentPath=/etc/systemd/system/atlas-codex-app-server.service' in
        vps_codex_app_server_properties.stdout_lines
      - "'DropInPaths=' in vps_codex_app_server_properties.stdout_lines"
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^ExecCondition=.*atlas-codex --service-admission')
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^ExecCondition=.*atlas-codex --service-preflight')
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^ExecStart=.*' ~ (vps_codex_release_path | regex_escape) ~
        '/bin/codex .*features\\.code_mode_host=true app-server --listen unix://')
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^Environment=.*CODEX_HOME=' ~
        ((vps_codex_home ~ '/.codex') | regex_escape))
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^RestrictAddressFamilies=.*AF_UNIX')
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^SocketBindDeny=.*ipv4')
      - >-
        vps_codex_app_server_properties.stdout is search(
        '(?m)^SocketBindDeny=.*ipv6')
      - >-
        vps_codex_app_server_properties.stdout_lines |
        select('match', '^MainPID=[1-9][0-9]*$') | list | length == 1
    fail_msg: >-
      The private Codex App Server is not active, persistent, isolated, or
      bound to its expected private Unix socket.

- name: Prove the private Codex App Server WebSocket proxy
  when: vps_codex_verify_proxy_smoke | default(false) | bool
  block:
    - name: Stop a stale Codex proxy verification unit
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - stop
          - atlas-codex-proxy-verification.service
      register: vps_codex_proxy_verification_initial_stop
      changed_when: false
      failed_when: vps_codex_proxy_verification_initial_stop.rc not in [0, 5]

    - name: Open a bounded WebSocket upgrade through the Codex proxy
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --signal=TERM
          - --kill-after=5s
          - 10s
          - /usr/bin/python3
          - -I
          - -c
          - |-
            import os
            import selectors
            import signal
            import subprocess
            import sys
            import time

            CAPTURE_LIMIT = 16384
            HEADER_END = b"\r\n\r\n"
            READ_TIMEOUT = 5.0
            CLEANUP_GRACE = 0.5
            DRAIN_GRACE = 0.25


            def normalized_returncode(returncode):
                if returncode is None or returncode == 0:
                    return 70
                if returncode < 0:
                    return min(255, 128 - returncode)
                return min(255, returncode)


            def append_bounded(destination, chunk):
                available = CAPTURE_LIMIT - len(destination)
                if available > 0:
                    destination.extend(chunk[:available])
                return len(chunk) > max(0, available)


            def read_ready(selector, timeout):
                overflow = False
                for key, _ in selector.select(timeout):
                    try:
                        chunk = os.read(key.fd, 4096)
                    except BlockingIOError:
                        continue
                    if not chunk:
                        selector.unregister(key.fd)
                        continue
                    overflow = append_bounded(key.data, chunk) or overflow
                return overflow


            def signal_group(process, requested_signal):
                try:
                    os.killpg(process.pid, requested_signal)
                    return True
                except (ProcessLookupError, PermissionError):
                    return False


            def interrupt(signum, _frame):
                raise InterruptedError(f"received {signal.Signals(signum).name}")


            request = sys.stdin.buffer.read(4097)
            if not request or len(request) > 4096:
                raise SystemExit("invalid WebSocket smoke request")
            if len(sys.argv) < 2:
                raise SystemExit("missing WebSocket proxy command")

            try:
                process = subprocess.Popen(
                    sys.argv[1:],
                    stdin=subprocess.PIPE,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    start_new_session=True,
                    bufsize=0,
                )
            except OSError as error:
                print(f"cannot start WebSocket proxy: {error}", file=sys.stderr)
                raise SystemExit(127) from error

            handled_signals = (signal.SIGTERM, signal.SIGHUP)
            for handled_signal in handled_signals:
                signal.signal(handled_signal, interrupt)

            assert process.stdin is not None
            assert process.stdout is not None
            assert process.stderr is not None
            for stream in (process.stdout, process.stderr):
                os.set_blocking(stream.fileno(), False)

            output = bytearray()
            errors = bytearray()
            failure = None
            overflow = False
            terminated_by_harness = False
            selector = selectors.DefaultSelector()
            selector.register(process.stdout.fileno(), selectors.EVENT_READ, output)
            selector.register(process.stderr.fileno(), selectors.EVENT_READ, errors)

            try:
                process.stdin.write(request)
                process.stdin.flush()
                deadline = time.monotonic() + READ_TIMEOUT
                while HEADER_END not in output:
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        raise TimeoutError("WebSocket response header timed out")
                    if read_ready(selector, min(remaining, 0.1)):
                        overflow = True
                        raise RuntimeError("WebSocket smoke output exceeded its bound")
                    if not selector.get_map():
                        break
            except BaseException as error:
                failure = error
            finally:
                for handled_signal in handled_signals:
                    signal.signal(handled_signal, signal.SIG_IGN)
                try:
                    process.stdin.close()
                except (BrokenPipeError, OSError):
                    pass
                process.stdin = None

                cleanup_deadline = time.monotonic() + CLEANUP_GRACE
                while True:
                    remaining = cleanup_deadline - time.monotonic()
                    if remaining <= 0:
                        break
                    if selector.get_map():
                        overflow = (
                            read_ready(selector, min(remaining, 0.05)) or overflow
                        )
                    else:
                        time.sleep(min(remaining, 0.05))

                terminated_by_harness = signal_group(process, signal.SIGTERM)
                termination_deadline = time.monotonic() + CLEANUP_GRACE
                while True:
                    remaining = termination_deadline - time.monotonic()
                    if remaining <= 0:
                        break
                    if selector.get_map():
                        overflow = (
                            read_ready(selector, min(remaining, 0.05)) or overflow
                        )
                    else:
                        time.sleep(min(remaining, 0.05))

                terminated_by_harness = (
                    signal_group(process, signal.SIGKILL)
                    or terminated_by_harness
                )
                try:
                    process.wait(timeout=CLEANUP_GRACE)
                except subprocess.TimeoutExpired as error:
                    if failure is None:
                        failure = error

                drain_deadline = time.monotonic() + DRAIN_GRACE
                while selector.get_map():
                    remaining = drain_deadline - time.monotonic()
                    if remaining <= 0:
                        break
                    overflow = read_ready(selector, remaining) or overflow
                selector.close()
                process.stdout.close()
                process.stderr.close()

            if isinstance(failure, (TimeoutError, InterruptedError)):
                result = 124
                diagnostic = str(failure)
            elif failure is not None:
                result = 70
                diagnostic = str(failure)
            elif overflow:
                result = 70
                diagnostic = "WebSocket smoke output exceeded its bound"
            elif HEADER_END not in output:
                result = normalized_returncode(process.returncode)
                diagnostic = (
                    "WebSocket proxy exited before its response header "
                    f"with status {process.returncode}"
                )
            elif process.returncode not in (None, 0) and not (
                terminated_by_harness
                and process.returncode in (-signal.SIGTERM, -signal.SIGKILL)
            ):
                result = normalized_returncode(process.returncode)
                diagnostic = f"WebSocket proxy exited with status {process.returncode}"
            else:
                result = 0
                diagnostic = None

            if diagnostic:
                if errors and not errors.endswith(b"\n"):
                    append_bounded(errors, b"\n")
                append_bounded(
                    errors,
                    f"atlas Codex proxy smoke: {diagnostic}\n".encode(),
                )

            header_end = output.find(HEADER_END)
            if header_end >= 0:
                emitted_output = output[:header_end + len(HEADER_END)]
            else:
                emitted_output = output

            sys.stdout.buffer.write(emitted_output)
            sys.stdout.buffer.flush()
            sys.stderr.buffer.write(errors)
            sys.stderr.buffer.flush()
            raise SystemExit(result)
          - /usr/sbin/runuser
          - --user
          - "{{ vps_codex_remote_user }}"
          - --
          - /usr/bin/env
          - -i
          - LANG=C.UTF-8
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - SSH_ORIGINAL_COMMAND=codex app-server proxy
          - "{{ vps_codex_remote_gate_path }}"
          - --runtime-validation
        stdin: >-
          {{ 'GET /rpc HTTP/1.1\r\n'
             ~ 'Host: codex-app-server\r\n'
             ~ 'Connection: Upgrade\r\n'
             ~ 'Upgrade: websocket\r\n'
             ~ 'Sec-WebSocket-Version: 13\r\n'
             ~ 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n\r\n' }}
        stdin_add_newline: false
      register: vps_codex_proxy_websocket_smoke
      changed_when: false
      failed_when: vps_codex_proxy_websocket_smoke.rc != 0

    - name: Confirm the Codex proxy completed the WebSocket upgrade
      ansible.builtin.assert:
        that:
          - vps_codex_proxy_websocket_smoke.rc == 0
          - >-
            vps_codex_proxy_websocket_smoke.stdout_lines[0:1] ==
            ['HTTP/1.1 101 Switching Protocols']
          - >-
            vps_codex_proxy_websocket_smoke.stdout is search(
            '(?im)^connection: upgrade\r?$')
          - >-
            vps_codex_proxy_websocket_smoke.stdout is search(
            '(?im)^upgrade: websocket\r?$')
          - >-
            vps_codex_proxy_websocket_smoke.stdout is search(
            '(?im)^sec-websocket-accept: '
            ~ 's3pPLMBiTxaQ9kYGzzhZRbK\+xOo=\r?$')
        fail_msg: >-
          The private App Server socket exists, but its Codex proxy did not
          complete a WebSocket upgrade.

  always:
    - name: Stop the bounded Codex proxy verification unit
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - stop
          - atlas-codex-proxy-verification.service
      register: vps_codex_proxy_verification_final_stop
      changed_when: false
      failed_when: vps_codex_proxy_verification_final_stop.rc not in [0, 5]

    - name: Read the bounded Codex proxy verification unit state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - atlas-codex-proxy-verification.service
      register: vps_codex_proxy_verification_final_state
      changed_when: false
      failed_when: vps_codex_proxy_verification_final_state.rc not in [3, 4]

    - name: Prove the Codex proxy verification unit was collected
      ansible.builtin.assert:
        that:
          - vps_codex_proxy_verification_final_state.rc in [3, 4]
          - >-
            vps_codex_proxy_verification_final_state.stdout in
            ['inactive', 'unknown']
        fail_msg: >-
          The bounded Codex proxy verification unit survived its smoke test.
