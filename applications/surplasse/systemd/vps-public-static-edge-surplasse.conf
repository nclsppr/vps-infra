[Unit]
BindsTo=docker.service
PartOf=docker.service
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Type=notify
NotifyAccess=main
KillMode=control-group
RemainAfterExit=no
ExecStart=
ExecStart=/srv/vps/runtime/surplasse/scripts/activate-surplasse-runtime --start-edge
ExecStop=
ExecStopPost=/usr/local/libexec/vps/activate-surplasse-runtime --stop-edge
Restart=on-failure
RestartSec=10
WatchdogSec=30

[Install]
WantedBy=docker.service
