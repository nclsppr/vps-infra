---
name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install locked tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Install locked Ansible collections
        working-directory: ansible
        run: |
          ../.venv/bin/ansible-galaxy collection install \
            --requirements-file collections/requirements.yml \
            --collections-path ../.cache/ansible/collections

      - name: Validate repository
        run: >-
          make check-fast check-platform-config check-prometheus check-caddy
          check-postgres-image
