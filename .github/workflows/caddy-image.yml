---
name: Caddy platform image

on:
  pull_request:
    paths:
      - .github/workflows/caddy-image.yml
      - platform/caddy/.dockerignore
      - platform/caddy/Dockerfile
      - platform/caddy/build.env
      - platform/caddy/entrypoint.sh
      - scripts/validate-caddy-build-inputs
  push:
    branches:
      - main
    paths:
      - .github/workflows/caddy-image.yml
      - platform/caddy/.dockerignore
      - platform/caddy/Dockerfile
      - platform/caddy/build.env
      - platform/caddy/entrypoint.sh
      - scripts/validate-caddy-build-inputs
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  CADDY_BUILD_ENV: platform/caddy/build.env

concurrency:
  group: caddy-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.architecture }} build
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and validate the pinned build inputs
        id: inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate-caddy-build-inputs \
            --github-output "${GITHUB_OUTPUT}" \
            "${CADDY_BUILD_ENV}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Build without registry credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: platform/caddy
          file: platform/caddy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            CADDY_BUILDER_IMAGE=${{ steps.inputs.outputs.builder }}
            CADDY_RUNTIME_IMAGE=${{ steps.inputs.outputs.runtime }}
            CADDY_DNS_MODULE=${{ steps.inputs.outputs.module }}
          cache-from: type=gha,scope=caddy-platform-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=caddy-platform-pr-${{ matrix.architecture }}

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and validate the pinned build inputs
        id: inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate-caddy-build-inputs \
            --github-output "${GITHUB_OUTPUT}" \
            "${CADDY_BUILD_ENV}"

      - name: Enable multi-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/caddy
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish the exact image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: platform/caddy
          file: platform/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_BUILDER_IMAGE=${{ steps.inputs.outputs.builder }}
            CADDY_RUNTIME_IMAGE=${{ steps.inputs.outputs.runtime }}
            CADDY_DNS_MODULE=${{ steps.inputs.outputs.module }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=caddy-platform
          cache-to: type=gha,mode=max,scope=caddy-platform
          provenance: mode=max
          sbom: true

      - name: Attest the pushed multi-architecture manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}/caddy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish digest in the workflow summary
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Caddy platform image'
            echo
            echo "\`ghcr.io/${GITHUB_REPOSITORY}/caddy@${IMAGE_DIGEST}\`"
            echo
            echo 'Create a separate pull request to promote this digest in the release manifest.'
          } >>"${GITHUB_STEP_SUMMARY}"
