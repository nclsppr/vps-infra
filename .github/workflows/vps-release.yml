---
name: Prove platform candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact secret-free platform candidate JSON
        required: true
        type: string
      candidate_subject:
        description: Canonical sha256 subject for the candidate JSON
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  packages: read

env:
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

concurrency:
  group: platform-proof-${{ github.event.inputs.candidate_subject }}
  cancel-in-progress: false

jobs:
  prove-platform-candidate:
    name: Prove platform candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the proof source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked proof tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          cache: true
        env:
          MISE_GITHUB_ATTESTATIONS: "true"
          MISE_GITHUB_SLSA: "true"
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Enable arm64 emulation for Caddy module verification
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Write the bounded candidate input
        shell: bash
        env:
          CANDIDATE_JSON: ${{ github.event.inputs.candidate }}
        run: |
          set -Eeuo pipefail
          [[ ${#CANDIDATE_JSON} -le 16384 ]]
          printf '%s\n' "${CANDIDATE_JSON}" >"${RUNNER_TEMP}/platform-candidate.json"

      - name: Verify every exact OCI subject
        id: proof
        shell: bash
        env:
          CANDIDATE_SUBJECT: ${{ github.event.inputs.candidate_subject }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          proof_file="platform-candidate-proof-${CANDIDATE_SUBJECT#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          ./scripts/prove-platform-candidate \
            --expected-subject "${CANDIDATE_SUBJECT}" \
            --source-revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${proof_file}" \
            "${RUNNER_TEMP}/platform-candidate.json"
          proof_sha256=$(sha256sum "${proof_file}" | awk '{print $1}')
          proof_size=$(wc -c <"${proof_file}" | tr -d ' ')
          {
            printf 'file=%s\n' "${proof_file}"
            printf 'sha256=sha256:%s\n' "${proof_sha256}"
            printf 'size=%s\n' "${proof_size}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload the digest-bound raw proof
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.proof.outputs.file }}
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Verify and publish immutable evidence metadata
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.proof.outputs.file }}
          CANDIDATE_SUBJECT: ${{ github.event.inputs.candidate_subject }}
          EXPECTED_DIGEST: ${{ steps.proof.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.proof.outputs.size }}
        run: |
          set -Eeuo pipefail
          normalized_digest="sha256:${ARTIFACT_DIGEST#sha256:}"
          [[ ${ARTIFACT_ID} =~ ^[1-9][0-9]*$ ]]
          [[ ${EXPECTED_SIZE} =~ ^[1-9][0-9]*$ ]]
          test "${normalized_digest}" = "${EXPECTED_DIGEST}"
          {
            echo '### Platform candidate proof'
            echo
            echo "Candidate: \`${CANDIDATE_SUBJECT}\`"
            echo "Artifact ID: \`${ARTIFACT_ID}\`"
            echo "Artifact name: \`${ARTIFACT_NAME}\`"
            echo "Artifact digest: \`${EXPECTED_DIGEST}\`"
            echo "Artifact bytes: \`${EXPECTED_SIZE}\`"
            echo
            echo "Verified gates: \`caddy-ovh-image\`, \`immutable-image-digests\`."
            echo 'The production activation policy remains locked.'
          } >>"${GITHUB_STEP_SUMMARY}"
