name: vps-public-static-edge

services:
  caddy:
    image: ghcr.io/nclsppr/vps-infra/caddy:sha-755565642f71918134151921f8eae63935951ad6@sha256:1879be5d28d98d49522d74f4fc1bd8c176fd4e35112f757b6639151f3170f11f
    ports:
      - target: 80
        published: "80"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: 0.0.0.0
        protocol: udp
    volumes:
      - type: bind
        source: /srv/vps/runtime/public-static-edge/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/vps/runtime/public-static-edge/routes
        target: /etc/caddy/routes
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/vps-public-edge-parkventory/route.caddy
        target: /etc/caddy/routes/parkventory.caddy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/www
        target: /srv/www
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
        volume: {}
      - type: volume
        source: caddy_config
        target: /config
        volume: {}
    networks:
      edge: {}
      app_parkventory:
        ipv4_address: 172.30.20.254
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    pids_limit: 128
    cpus: 0.75
    mem_limit: 268435456
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: 10m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  app_parkventory:
    external: true
    name: app_parkventory
  edge:
    external: true
    name: edge

volumes:
  caddy_data:
    name: vps-public-static-edge-caddy-data
  caddy_config:
    name: vps-public-static-edge-caddy-config
